[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgecase-provocateur"
version = "0.1.0"
description = "An educational tool that probes Python functions with edge cases and explains failures with Socratic feedback."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ahmed Raza" },
    { name = "Hamza Hafeez" },
    { name = "Usman Ahmed" },
]
keywords = ["testing", "edge cases", "education", "debugging", "decorator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/ahmed123-ar/edgecase-provocateur"
Repository = "https://github.com/ahmed123-ar/edgecase-provocateur"
Issues = "https://github.com/ahmed123-ar/edgecase-provocateur/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
